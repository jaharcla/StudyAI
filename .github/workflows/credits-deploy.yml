name: credits-deploy

on:
  workflow_dispatch:
  push:
    tags: ["credits-v*"]

permissions:
  contents: read

concurrency:
  group: credits-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck hosted Worker
        run: npx tsc -p hosted/tsconfig.json

      - name: Install Worker dependencies
        working-directory: hosted
        run: npm ci

      - name: Worker tests
        working-directory: hosted
        run: npm test

      - name: Apply D1 migration
        working-directory: hosted
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:apply

      - name: Deploy Worker
        working-directory: hosted
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
