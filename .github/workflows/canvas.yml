name: canvas

on:
  push:
    # Every branch, not an enumerated list of prefixes. An enumerated list means a
    # new prefix (fix/**, ci/**, feat/**) silently gets no CI: that is how six
    # commits on fix-canvas-intelligence-recovery were never built or tested.
    # The repo is public, so the extra push run alongside the pull_request run
    # costs no Actions minutes.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Read-only token: this job only checks out and runs tests.
permissions:
  contents: read

concurrency:
  group: canvas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npx vitest run --reporter=dot

# Not in CI:
#   - tests/e2e: needs the loopback services, a real model provider and a Chromium session.
#   - npm run benchmark:canvas: needs provider keys and data/canvas-dataset-benchmark,
#     which is gitignored. Run both locally with /canvas-verify before a canvas PR.
